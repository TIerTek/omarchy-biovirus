# BioVirus additions for kitty — https://github.com/TierTek/omarchy-biovirus
# Installed by install.sh --hud as ~/.config/kitty/biovirus.conf and pulled in
# with `include biovirus.conf` at the END of kitty.conf, so these win over the
# defaults above them. Remove that one line to switch the HUD off.
#
# Needs a Nerd Font (Omarchy's default JetBrainsMono Nerd Font is fine) for the
# biohazard glyph in the tab bar.

# BioVirus cursor trail: the cursor leaves a fading #4bffa5 smear
# when it jumps (the "spore trail"). cursor_trail is the delay in ms before the
# trail starts, so 1 = immediately; decay is fast-edge / slow-edge seconds.
cursor_trail 1
cursor_trail_decay 0.08 0.35
cursor_trail_start_threshold 2
cursor_trail_color #4bffa5

# BioVirus watermark: the lock screen's biohazard badge, faint, in
# the bottom-right of every window. PNG rendered from the Nerd Font glyph
# U+F00A7 (nf-md-biohazard) at ~/.config/kitty/biohazard.png. scale = % of the
# shortest window dimension.
window_logo_path ~/.config/kitty/biohazard.png
window_logo_position bottom-right
window_logo_alpha 0.07
window_logo_scale 22
shell_integration no-cursor
enable_audio_bell no

# Tab bar: BioVirus containment HUD. Drawn by tab_bar.py (custom
# style) — bracketed active tab with the biohazard badge, dim inactive tabs,
# alarm-red on a bell, rail + "BIOVIRUS·LVL-4" status flush right.
# min_tabs 1 keeps the HUD rail visible even with a single tab; set 2 to hide
# it until a second tab opens (kitty's default).

tab_bar_edge                bottom
tab_bar_style               custom
tab_bar_min_tabs            1
tab_bar_margin_height       2.0 0.0
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
